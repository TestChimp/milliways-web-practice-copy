name: SmartTests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smarttests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            tests/package-lock.json

      - name: Start backend stack
        run: |
          docker compose up --build -d
          echo "Waiting for API to be healthy..."
          for i in {1..30}; do
            if curl -sf http://localhost:3001/health > /dev/null 2>&1; then
              echo "✓ API is healthy"
              exit 0
            fi
            echo "  Attempt $i/30 - waiting 2s..."
            sleep 2
          done
          echo "✗ API did not become healthy in time"
          docker compose logs api
          exit 1

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Install SmartTests dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Run SmartTests (web)
        working-directory: tests
        run: npm run test:web
        env:
          CI: true
          BASE_URL: http://localhost:4200
          TESTCHIMP_API_KEY: ${{ secrets.TESTCHIMP_API_KEY }}
          TESTCHIMP_PROJECT_ID: ${{ secrets.TESTCHIMP_PROJECT_ID }}
          TESTCHIMP_BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/test-results/
          retention-days: 7
          if-no-files-found: ignore
